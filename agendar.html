<!DOCTYPE html>
<html lang="pt-br">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="img/iconweb.png">

    <title>Agendar horário | Barbearia Pente Fino</title>
</head>
</head>
<body>
    <header class="header">
        <section>
            <a href="index.html" class="logo">
                <img src="./img/logo1.png" width="192" height="105" alt="logo">
            </a>
            <nav class="navbar">
                <a href="index.html#home">Início</a>
                <a href="index.html#servicos">Serviços</a>
                <a href="index.html#about">Sobre</a>
                <a href="index.html#review">Avaliações</a>
            </nav>

            <div class="icons">
                <img width="30" height="30"
                    src="https://img.icons8.com/fluency-systems-regular/48/FFFFFF/instagram-new--v1.png"
                    alt="instagram-new--v1" />
                <img width="30" height="30"
                    src="https://img.icons8.com/fluency-systems-regular/30/FFFFFF/whatsapp--v1.png"
                    alt="whatsapp--v1" />

                <a href="#" class="btn-login" aria-label="Login">
                    <span>LOGIN</span>
                </a>

                <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </section>
    </header>

    <div class="agendar-container">
        <section>
            <h1 class="agendar-titulo">AGENDAR HORÁRIO</h1>
            <p class="agendar-subtitulo">Escolha os serviços, o dia e o horário que preferir.</p>

            <div class="agendar-card">
                <div class="passo" id="passo-servicos">
                    <h2 class="passo-titulo">1. Escolha os serviços</h2>

                    <h3 class="categoria">Cortes</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte" data-preco="30" data-duracao="40">
                                <span class="servico-nome">Corte</span>
                                <span class="servico-tempo">40 min</span>
                                <span class="servico-preco">R$ 30,00</span>
                            </label>
                        </li>

                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte-sobrancelha" data-preco="35" data-duracao="50">
                                <span class="servico-nome">Corte + Sobrancelha</span>
                                <span class="servico-tempo">50 min</span>
                                <span class="servico-preco">R$ 35,00</span>
                            </label>
                        </li>

                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte-hair-design" data-preco="35" data-duracao="60">
                                <span class="servico-nome">Corte + Hair Design (desenho)</span>
                                <span class="servico-tempo">1h</span>
                                <span class="servico-preco">R$ 35,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="acabamento" data-preco="10" data-duracao="20">
                                <span class="servico-nome">Acabamento</span>
                                <span class="servico-tempo">20 min</span>
                                <span class="servico-preco">R$ 10,00</span>
                            </label>
                        </li>
                    </ul>

                    <h3 class="categoria">Barba</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="barba" data-preco="25" data-duracao="40">
                                <span class="servico-nome">Barba</span>
                                <span class="servico-tempo">40 min</span>
                                <span class="servico-preco">R$ 25,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="barba-barboterapia" data-preco="30" data-duracao="30">
                                <span class="servico-nome">Barba + Barboterapia</span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 30,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="barba-sobrancelha" data-preco="30" data-duracao="30">
                                <span class="servico-nome">Barba + Sobrancelha</span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 30,00</span>
                            </label>
                        </li>
                    </ul>

                    <h3 class="categoria">Combos</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="combo-corte-barba" data-preco="50" data-duracao="60">
                                <span class="servico-nome">Combo: Corte + Barba</span>
                                <span class="servico-tempo">1h</span>
                                <span class="servico-preco">R$ 50,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="combo-completo-corte-barba-sobrancelha" data-preco="55" data-duracao="60">
                                <span class="servico-nome">Combo completo: Corte + Barba + Sobrancelha</span>
                                <span class="servico-tempo">1h</span>
                                <span class="servico-preco">R$ 55,00</span>
                            </label>
                        </li>
                    </ul>

                    <h3 class="categoria">Rosto e Sobrancelha</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="sobrancelha" data-preco="10" data-duracao="10">
                                <span class="servico-nome">Sobrancelha</span>
                                <span class="servico-tempo">10 min</span>
                                <span class="servico-preco">R$ 10,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="limpeza-de-pele" data-preco="25" data-duracao="40">
                                <span class="servico-nome">Limpeza de Pele</span>
                                <span class="servico-tempo">40 min</span>
                                <span class="servico-preco">R$ 25,00</span>
                            </label>
                        </li>
                    </ul>

                    <h3 class="categoria">Coloração e Luzes</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="pigmentacao-barba-ou-cabelo" data-preco="20" data-duracao="30">
                                <span class="servico-nome">Pigmentação (Barba ou Cabelo)</span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 20,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="coloracao-pigmentacao-produto-a-parte" data-preco="20" data-duracao="30">
                                <span class="servico-nome">Coloração/Pigmentação <small class="etiqueta">produto à parte</small></span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 20,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte-pigmentacao" data-preco="50" data-duracao="90">
                                <span class="servico-nome">Corte + Pigmentação</span>
                                <span class="servico-tempo">1h30</span>
                                <span class="servico-preco">R$ 50,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="luzes-platinado-reflexo" data-preco="80" data-duracao="120">
                                <span class="servico-nome">Luzes/Platinado/Reflexo</span>
                                <span class="servico-tempo">2h</span>
                                <span class="servico-preco">R$ 80,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte-platinado-luzes-reflexo" data-preco="100" data-duracao="180">
                                <span class="servico-nome">Corte + Platinado/Luzes/Reflexo</span>
                                <span class="servico-tempo">3h</span>
                                <span class="servico-preco">R$ 100,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="corte-barba-platinado-luzes-reflexo" data-preco="130" data-duracao="180">
                                <span class="servico-nome">Corte + Barba + Platinado/Luzes/Reflexo</span>
                                <span class="servico-tempo">3h</span>
                                <span class="servico-preco">R$ 130,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="matizador" data-preco="10" data-duracao="10">
                                <span class="servico-nome">Matizador</span>
                                <span class="servico-tempo">10 min</span>
                                <span class="servico-preco">R$ 10,00</span>
                            </label>
                        </li>
                    </ul>

                    <h3 class="categoria">Tratamentos</h3>
                    <ul class="lista-servicos">
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="botox" data-preco="50" data-duracao="120">
                                <span class="servico-nome">Botox</span>
                                <span class="servico-tempo">2h</span>
                                <span class="servico-preco">R$ 50,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="botox-produto-a-parte" data-preco="25" data-duracao="120">
                                <span class="servico-nome">Botox <small class="etiqueta">produto à parte</small></span>
                                <span class="servico-tempo">2h</span>
                                <span class="servico-preco">R$ 25,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="alisante-produto-a-parte" data-preco="15" data-duracao="60">
                                <span class="servico-nome">Alisante <small class="etiqueta">produto à parte</small></span>
                                <span class="servico-tempo">1h</span>
                                <span class="servico-preco">R$ 15,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="hidratacao" data-preco="15" data-duracao="30">
                                <span class="servico-nome">Hidratação</span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 15,00</span>
                            </label>
                        </li>
                        <li>
                            <label class="servico-opcao">
                                <input type="checkbox" name="servico" value="lavagem-capilar" data-preco="15" data-duracao="30">
                                <span class="servico-nome">Lavagem Capilar</span>
                                <span class="servico-tempo">30 min</span>
                                <span class="servico-preco">R$ 15,00</span>
                            </label>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
